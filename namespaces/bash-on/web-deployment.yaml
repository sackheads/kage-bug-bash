apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: bash-on
spec:
  replicas: 2
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: web
          image: registry.k8s.io/pause:3.10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
