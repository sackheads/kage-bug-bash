apiVersion: apps/v1
kind: Deployment
metadata:
  name: crashy
  namespace: bash-crash
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crashy
  template:
    metadata:
      labels:
        app: crashy
    spec:
      containers:
        - name: crashy
          image: busybox:1.36
          command: ["sh", "-c", "echo starting; while true; do sleep 3600; done"]
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
